apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-sidecar-config
  namespace: int-ksm-back
data:
  config.yml: |
    server:
      http_listen_port: 9080
    positions:
      filename: /tmp/positions.yaml
    clients:
      - url: http://loki.int-ksm-backdata.svc.cluster.local:3100/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        static_configs:
          - targets:
              - localhost
            labels:
              job: kubernetes-pods
              __path__: /var/log/pods/int-ksm-backdata_*/*/*.log