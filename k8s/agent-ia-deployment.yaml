apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-ia
  namespace: int-ksm-back
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-ia
  template:
    metadata:
      labels:
        app: agent-ia
    spec:
      containers:
        - name: agent-ia
          image: adelmachat/agent-ia:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: agent-ia-config

        - name: promtail
          image: grafana/promtail:latest
          args:
            - -config.file=/etc/promtail/config.yml
          volumeMounts:
            - name: promtail-config
              mountPath: /etc/promtail
            - name: varlog
              mountPath: /var/log/pods
              readOnly: true

        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.10.0
          args:
            - --namespaces=int-ksm-backdata
            - --resources=pods
          ports:
            - containerPort: 8080
              name: http-metrics

      volumes:
        - name: varlog
          hostPath:
            path: /var/log/pods
        - name: promtail-config
          configMap:
            name: promtail-sidecar-config